trigger:
  branches:
    include:
      - feature/its/1_fabric_item_synchronization

pool:
  vmImage: "ubuntu-24.04"

resources:
  repositories:
    - repository: CICD
      name: "Plateforme Technologique/CICD"
      type: git
      ref: "refs/heads/main"

extends:
  template: PipelineTemplate.yaml@CICD

  parameters:
    versioning:
      mode: legacy
      major: 1
      minor: 0

    build:       
      sonarQube:
        projectKey: Discovery_DP-FAB-Item-Framework-Managed         
        projectName: "[Discovery] DP FAB Item Framework Managed"
        qualityGateName: "[Discovery] Starter"
        createAppWithMainBranch: true
 
      steps:
        - type: pythonV2
          name: dpFabItemFrameworkManaged
          src: .
          pythonVersion: 3.11.0
          packageName: "dp_item_framework"
          disableDocs: true
          sonarQube:
            sonarExclusions: >
              **/__init__.py,
              build/**,
              dist/**,
              **/*.egg-info/**
